[package]
name = "auralis-ipc"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
auralis-core = { path = "../auralis-core" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
windows-sys = { version = "*", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO"
] }
